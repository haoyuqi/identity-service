name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-script-tests:
    name: Release script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

  quality:
    name: Quality checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4.27'
          coverage: none
          extensions: pdo_pgsql, redis
          tools: composer:2.10.3

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check actual PHP platform requirements
        run: composer check-platform-reqs

      - name: Check formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

  tests:
    name: Tests and 100% application line coverage
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: identity_service_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U identity_service_admin -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: testing
      TEST_DB_CONNECTION: pgsql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_DATABASE: identity_service_test
      TEST_DB_USERNAME: identity_service_test
      TEST_DB_PASSWORD: ''
      TEST_DB_URL: ''
      PGTZ: UTC
      REDIS_TEST_HOST: 127.0.0.1
      REDIS_TEST_PORT: '6379'
      REDIS_TEST_DATABASE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4.27'
          coverage: pcov
          extensions: pdo_pgsql, redis
          tools: composer:2.10.3

      - name: Create an ephemeral application key
        run: |
          APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          echo "::add-mask::$APP_KEY"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"

      - name: Create the isolated test role
        run: |
          psql --host=127.0.0.1 --username=identity_service_admin --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE identity_service_test LOGIN CREATEDB;
          SQL

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check actual PHP platform requirements
        run: composer check-platform-reqs

      - name: Run tests and enforce complete coverage
        run: composer test:coverage

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-line-coverage
          path: build/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
