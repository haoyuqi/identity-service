name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to preview (never publishes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Validate stable tag on main
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 .github/scripts/release-notes.py validate --tag "$RELEASE_TAG"

  checks:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  container-checks:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/container-smoke.yml

  notes:
    needs: [validate, checks, container-checks]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.checks.result == 'success' && needs.container-checks.result == 'success')) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Generate bilingual notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
        run: python3 .github/scripts/release-notes.py generate --tag "$RELEASE_TAG"
      - name: Save notes for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  image:
    needs: [validate, checks, container-checks, notes]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing release image
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          if docker buildx imagetools inspect --raw "$IMAGE" > "$RUNNER_TEMP/identity-image.json" 2> "$RUNNER_TEMP/identity-image.err"; then
            python3 .github/scripts/verify-image.py "$RUNNER_TEMP/identity-image.json" "$EXPECTED_SHA"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown|name unknown|404' "$RUNNER_TEMP/identity-image.err"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/identity-image.err" >&2
            exit 1
          fi
      - name: Publish verified architectures
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          annotations: index:org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          provenance: true
      - name: Verify published release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > "$RUNNER_TEMP/identity-image.json"
          python3 .github/scripts/verify-image.py "$RUNNER_TEMP/identity-image.json" "$EXPECTED_SHA"

  publish:
    needs: [validate, checks, container-checks, notes, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; keeping its notes unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
