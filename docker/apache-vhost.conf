<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    LogFormat "\"%m\" %>s %D" privacy_safe
    CustomLog /proc/self/fd/1 privacy_safe
</VirtualHost>
