name: identity-service

# Select bundled dependencies with COMPOSE_PROFILES or --profile database and/or
# --profile redis. Without a profile, DB_HOST and REDIS_HOST must point to
# external services reachable through the postgres and redis networks.
services:
  app:
    image: ${IDENTITY_IMAGE:-ghcr.io/haoyuqi/identity-service}:${IDENTITY_VERSION:-latest}
    restart: unless-stopped
    # Optional so CI without an env file still parses. The explicit mapping below
    # keeps the variables exported by the smoke script.
    env_file:
      - path: ${COMPOSE_ENV_FILE:-.env}
        required: false
    ports:
      - "127.0.0.1:${IDENTITY_BIND_PORT:-8081}:8080"
    environment:
      APP_NAME: Identity Service
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set a persistent APP_KEY in the deployment env file}
      APP_URL: ${APP_URL:?Set the public HTTPS origin}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-identity_service}
      DB_USERNAME: ${DB_USERNAME:-identity_service}
      DB_PASSWORD: ${DB_PASSWORD:?Set the database password in the deployment env file}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-null}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./docker/apache-limits.conf:/etc/apache2/conf-enabled/zz-limits.conf:ro
      - ./docker/php-production.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
    networks:
      default: {}
      postgres: {}
      redis: {}
      ingress:
        aliases:
          - identity-upstream
    mem_limit: ${IDENTITY_MEMORY_LIMIT:-384m}
    cpus: ${IDENTITY_CPU_LIMIT:-0.75}
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/ready') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    profiles: [database]
    image: postgres:18.6
    restart: unless-stopped
    networks: [postgres]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-identity_service}
      POSTGRES_USER: ${DB_USERNAME:-identity_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set the database password in the deployment env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [redis]
    image: redis:7.4.12-alpine
    restart: unless-stopped
    networks: [redis]
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    cpus: ${REDIS_CPU_LIMIT:-0.2}
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default: {}
  postgres:
    name: ${POSTGRES_NETWORK:-${COMPOSE_PROJECT_NAME:-identity-service}_postgres}
    external: ${POSTGRES_NETWORK_EXTERNAL:-false}
  redis:
    name: ${REDIS_NETWORK:-${COMPOSE_PROJECT_NAME:-identity-service}_redis}
    external: ${REDIS_NETWORK_EXTERNAL:-false}
  ingress:
    name: ${INGRESS_NETWORK:-${COMPOSE_PROJECT_NAME:-identity-service}_ingress}
    external: ${INGRESS_NETWORK_EXTERNAL:-false}
